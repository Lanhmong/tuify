[package]
name = "tuify"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.0"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.33"
rand = "0.10.2"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["macros", "sync", "rt-multi-thread"] }
url = "2.5.8"
webbrowser = "1.2.2"
